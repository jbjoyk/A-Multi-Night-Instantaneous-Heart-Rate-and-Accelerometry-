# Manuscript Verification Claim Registry
# GUARDRAIL: Zero numeric values are copied from .tex or .md manuscripts into this file.
# Every canonical value is computed directly at runtime from the raw artifacts on disk
# by scripts/verify_manuscript_numbers.py.

schema_version: "1.1"
bootstrap_resamples: 10000
bootstrap_seed: 42
sd_ddof: 1

target_documents:
  manuscript_tex: "paper_orchestra_out/manuscript_jbhi.tex"
  manuscript_pdf: "paper_orchestra_out/manuscript_jbhi.pdf"
  manuscript_md: "research_knowledge/updates/MANUSCRIPT_DRAFT_v2.0.md"
  technical_report_md: "author_report_bundle/TECHNICAL_EXPERIMENTAL_REPORT.md"
  model_specs_md: "author_report_bundle/MODEL_EQUATIONS_AND_SPECS_FOR_DIAGRAMS.md"
  report_tables_dir: "author_report_bundle/tables"
  figure_scripts:
    - "scripts/build_report_figures_2_3_4.py"
    - "scripts/generate_fig_exp030_exp031_pareto.py"
    - "scripts/generate_manuscript_figures.py"
    - "scripts/generate_fig1_ultradian_coupler.py"

raw_artifacts:
  bidsleep_raw_dir: "a-multi-night-instantaneous-heart-rate-and-accelerometry-dataset-with-eeg-sleep-stage-labels-1.0.0"
  bidsleep_readme: "a-multi-night-instantaneous-heart-rate-and-accelerometry-dataset-with-eeg-sleep-stage-labels-1.0.0/README.md"
  sleepaccel_raw_dir: "data/external/sleepaccel_v1.0.0"
  fold_manifests: "review_package/fold_manifests.csv"
  night_inventory: "review_package/night_inventory.csv"
  confusion_matrices: "author_report_bundle/data/confusion_matrices.json"
  w100_summary: "experiments/EXP-031/W100_retrained_summary.json"
  exp031_confirmatory: "experiments/EXP-031/exp031_confirmatory_summary.json"
  interleaved_cpu_latency: "experiments/EXP-031/interleaved_cpu_latency.json"
  interleaved_fp32_4t_rerun: "docs/verification/interleaved_cpu_latency_fp32_4t_rerun.json"
  int8_profiles:
    Model_A: "experiments/STAGE2_FINAL_MODEL/int8_quantization_profile.json"
    full_v5: "experiments/EXP-029/full_v5_w0b_int8_profile.json"
    p1_100k: "experiments/EXP-030/p1_100k_w0b_int8_profile.json"
    P190: "experiments/EXP-031/P190_w0b_int8_profile.json"
  subject_metrics:
    Model_A: "experiments/STAGE2_FINAL_MODEL/final_model_oof_subject_metrics.csv"
    W100: "experiments/EXP-031/runs/W100/W100_subject_metrics.csv"
    full_v5: "experiments/EXP-029/full_v5_subject_metrics.csv"
    p1_100k: "experiments/EXP-030/p1_100k_subject_metrics.csv"
    P190: "experiments/EXP-031/P190_subject_metrics.csv"
    SLAMSS_IFS: "experiments/EXP-021/slamss_ifs_matched_subject_metrics.csv"
    W050: "experiments/EXP-031/W050_subject_metrics.csv"
    W075: "experiments/EXP-031/W075_subject_metrics.csv"
    B: "experiments/EXP-029/cnn_bigru_200k_subject_metrics.csv"
    W125: "experiments/EXP-031/W125_subject_metrics.csv"
    W150: "experiments/EXP-031/W150_subject_metrics.csv"
    W200: "experiments/EXP-031/W200_subject_metrics.csv"
    W250: "experiments/EXP-031/W250_subject_metrics.csv"
  k_curve_subject_metrics: "experiments/EXP-019/exp019_k_curve_subject_metrics.csv"
  sleepaccel_qc_summary: "experiments/EXP-027/sleepaccel_qc_summary.csv"
  sleepaccel_exp027_metrics: "experiments/EXP-027/exp027_per_subject_metrics.csv"
  sleepaccel_exp027_summary: "experiments/EXP-027/exp027_summary.json"
  sleepaccel_exp028_tuples: "experiments/EXP-028/exp028_sleepaccel_raw_paired_tuples.csv"
  sleepaccel_exp028_ba: "experiments/EXP-028/exp028_sleepaccel_bland_altman_summary.csv"
  sleepaccel_p1_metrics: "experiments/EXP-030/p1_100k_sleepaccel_metrics.csv"
  sleepaccel_p1_ba: "experiments/EXP-030/p1_100k_sleepaccel_bland_altman.csv"
  sleepaccel_p190_metrics: "experiments/EXP-031/P190_sleepaccel_metrics.csv"
  sleepaccel_p190_ba: "experiments/EXP-031/P190_sleepaccel_bland_altman.csv"
  sleepaccel_v5_metrics: "experiments/EXP-029/full_v5_sleepaccel_metrics.csv"
  sleepaccel_reconciled_references: "experiments/EXP-033/reconciled_references.json"
  exp033_distribution_stats: "experiments/EXP-033/exp033_distribution_stats.csv"
  exp031_recipe_comparison: "experiments/EXP-031/recipe_comparison_table.csv"

checks:
  - id: "CHECK_A"
    name: "Parameters & Compression Ratios"
    rule: "Instantiate all 6 PyTorch architectures directly and verify sum(p.numel()) == sum(submodule params), SLAMSS-IFS cnn/cnn3/s2s decompositions, P190 vs full_v5 relative delta, and SLAMSS-IFS compression ratios."
    tolerance: {exact_int: 0, ratio_abs: 0.01, pct_abs: 0.05}
  - id: "CHECK_B"
    name: "Epochs & Fold Manifests"
    rule: "Recompute usable nights, total valid epochs, epochs/night, 3-seed pooled confusion-matrix totals, 15-checkpoint SleepAccel totals, and 5-fold subject/night sums directly from night_inventory.csv, fold_manifests.csv, and confusion_matrices.json."
    tolerance: {exact_int: 0, mean_abs: 0.1}
  - id: "CHECK_C"
    name: "Class Mixes from Raw Labels"
    rule: "Recompute (i) masked N=47 pooled epochs, (ii) raw unmasked labels.mat pooled/participant-avg/night-avg mixes, (iii) legacy 31-subject train split mix, and (iv) SleepAccel qc_clean n=25 raw and masked pooled mixes. HARD_FAIL on any pair of reported mixes identical in 2 classes while differing by +/-x in the other 2, or stale 12.8/44.2/18.9/24.1 or Deep 15.5%/REM 18.6%."
    tolerance: {pct_abs: 0.1}
  - id: "CHECK_D"
    name: "Macro-F1 (ddof=1) & Pooled-Epoch Macro-F1"
    rule: "Recompute participant-mean Macro-F1 (averaging seeds within subject first) and SD with ddof=1 across all models, plus pooled-epoch Macro-F1 from confusion_matrices.json; verify identical mean +/- SD across documents."
    tolerance: {pct_abs: 0.01}
  - id: "CHECK_E"
    name: "Paired Statistics (Bootstrap, Wilcoxon, Cohen's dz, Holm-Bonferroni)"
    rule: "Recompute Delta, 10,000-resample bootstrap 95% CI (seed=42), two-sided Wilcoxon p, Cohen's dz, and Holm-Bonferroni adjusted p for W100-ModelA, W100-P190, W100-p1_100k, W100-SLAMSS-IFS, and full_v5-P190; verify legacy Model A row equals locked EXP-019 values (+1.0054 pp, CI [-0.17, +1.99], one-sided p=0.00131)."
    tolerance: {delta_pp: 0.005, ci_pp: 0.02, p_rel: 0.01, dz_abs: 0.005}
  - id: "CHECK_F"
    name: "Page's L Trend Test & Label Verification"
    rule: "Recompute Page's L, z, one-sided p, two-sided p, and 4x/5x Holm-adjusted one-sided p from per-subject CSVs (EXP-031 H-SCALE, H-SCALE-R, and EXP-019 k=1..4). HARD_FAIL if any reported Page's L p-value lacks an explicit raw/Holm-adjusted and one-sided/two-sided label or mismatches the recomputed value for its label. Audit every reported p-value label across all documents."
    tolerance: {L_abs: 0.01, z_abs: 0.002, p_rel: 0.02}
  - id: "CHECK_G"
    name: "SleepAccel External Validation & Bland-Altman"
    rule: "Recompute qc_clean (n=25) and all_n31 (N=31) single-model and ensemble Macro-F1, Bland-Altman bias/LoA/MAE/r from raw paired tuples, verify identical Wilcoxon W=106.0 mirror footnote for qc_clean accuracy & Wake F1, enforce that no two cohorts share identical reference values unless explicitly justified in the registry, and flag any unexplained duplicate 4-decimal p-values."
    tolerance: {pct_abs: 0.01, ba_abs: 0.02, r_abs: 0.0005}
  - id: "CHECK_H"
    name: "Latency, Memory, Hardware Telemetry & CV Gate"
    rule: "Verify FP32 KiB = params*4/1024, canonical INT8 weight payload and exact reduction %, FP32-vs-FP32 and INT8-vs-INT8 speedups alongside MMAC ratios, exact /proc/cpuinfo CPU string + governor + torch.__version__, INT8 CV <= 5%, 4T FP32 rerun compliance (CV <= 5% or marked 'not reported (CV > 5%)'), and strict separation of FP32/INT8 columns and interleaved latencies in tables."
    tolerance: {kib_abs: 0.02, pct_abs: 0.1, cv_max_pct: 5.0}
  - id: "CHECK_I"
    name: "Cross-Document Consistency & 100% Numeric Coverage"
    rule: "Scan .tex, .md, pdftotext of compiled PDFs, and figure annotation scripts for cross-document consistency and verify 100% numeric token coverage in Abstract, Results, and Tables."
    tolerance: {coverage_pct: 100.0}
  - id: "CHECK_J"
    name: "Banned Phrases, Dataset Versions & Unverified External Claims"
    rule: "HARD_FAIL on 'SOTA', 'parity' (anywhere, even with CI), 'proves', 'retains N%', 'Ultradian', 'UMass Amherst', 'credentialed', 'four canonical', 'k >= 3' as night index, internal IDs (DEC-, EXP-0, P101) in manuscript prose, 'first' priority claims, 'Apple Watch Series 6', wrong SleepAccel/BIDSleep versions, or missing separate Walch 2019 / SleepAccel DOI citations."

# Promoted 7 former open issues — now enforced as HARD_FAIL gates
hard_fail_gates:
  - id: "EF-01"
    check_group: "J"
    title: "Unverified hardware model 'Apple Watch Series 6' absent from BIDSleep README"
    target: "All manuscripts"
    enforcement: "HARD_FAIL"
  - id: "EF-02"
    check_group: "J"
    title: "Dataset versions (SleepAccel v1.0.0 + separate Walch 2019 & DOI citations; BIDSleep v1.0.1)"
    target: "All manuscripts"
    enforcement: "HARD_FAIL"
  - id: "EF-03"
    check_group: "C"
    title: "Class-mix pair identical in 2 classes and +/-x in the other 2; stale 12.8/44.2/18.9/24.1 or Deep 15.5%/REM 18.6%"
    target: "All manuscripts"
    enforcement: "HARD_FAIL"
  - id: "EF-04"
    check_group: "F"
    title: "Page's L p-value explicit raw/Holm-adjusted & one-sided/two-sided label verified against recomputed value"
    target: "All manuscripts"
    enforcement: "HARD_FAIL"
  - id: "EF-05"
    check_group: "H"
    title: "Latency/memory table separation (FP32 vs INT8 columns, consistent interleaved 4T INT8 ms, and 4T FP32 CV <= 5% or not-reported deviation)"
    target: "All manuscripts & latency JSONs"
    enforcement: "HARD_FAIL"
  - id: "EF-06"
    check_group: "J"
    title: "Banned phrases in manuscript prose ('UMass Amherst', 'Ultradian', 'proves', 'four canonical', 'k >= 3', 'parity', 'SOTA', 'retains N%', 'credentialed', 'first' priority)"
    target: "All manuscripts"
    enforcement: "HARD_FAIL"
  - id: "EF-07"
    check_group: "J"
    title: "Internal project tracking IDs (DEC-, EXP-0, P101) in manuscript prose"
    target: "paper_orchestra_out/manuscript_jbhi.tex, research_knowledge/updates/MANUSCRIPT_DRAFT_v2.0.md"
    enforcement: "HARD_FAIL"
  - id: "CLM-032"
    check_group: "B"
    title: "EXP-032 M1/M2/M3 BIDSleep 5-fold CV (65.21%, 65.18%, 67.38% Macro-F1; 69.75% Accuracy; 87.75 ms 4T FP32)"
    target: "experiments/EXP-032/, MANUSCRIPT_DRAFT_v2.0.md, manuscript_jbhi.tex, TECHNICAL_EXPERIMENTAL_REPORT.md"
    enforcement: "HARD_FAIL"
  - id: "CLM-033"
    check_group: "F"
    title: "EXP-033 W100 Personalization (H-A2 +0.58 pp [med +0.75, 30W/16L/0T, p_Holm=0.0263] NOT SUPPORTED practically; S-SPEC +1.45 pp [med +1.31, p_Holm=2.47e-5] INCONCLUSIVE; E4 Page L=835.0 p=0.5667; GATE_tau no benefit) & W100 SleepAccel (61.23%/62.93% n=25, +0.14 pp vs SLAMSS-IFS, 2.36 pp 80% MDE, no BA clinical-agreement claim)"
    target: "experiments/EXP-033/exp033_summary.json, MANUSCRIPT_DRAFT_v2.0.md, manuscript_jbhi.tex, TECHNICAL_EXPERIMENTAL_REPORT.md"
    enforcement: "HARD_FAIL"
  - id: "EF-08"
    check_group: "G"
    title: "SleepAccel cohort reference collision audit (no two cohorts share identical reference values unless explicitly justified in registry)"
    target: "experiments/EXP-033/reconciled_references.json"
    enforcement: "HARD_FAIL"
  - id: "EF-09"
    check_group: "E"
    title: "Legacy Model A personalization row matches locked EXP-019 values (+1.0054 pp, CI [-0.17, +1.99], one-sided p=0.00131)"
    target: "experiments/EXP-019/exp019_stage_c_results.json, experiments/EXP-033/exp033_summary.json"
    enforcement: "HARD_FAIL"
  - id: "EF-10"
    check_group: "F"
    title: "Reported p-value label and recomputation audit (every reported p-value label raw/adjusted & 1s/2s matches recomputed value)"
    target: "All manuscripts and reports"
    enforcement: "HARD_FAIL"

